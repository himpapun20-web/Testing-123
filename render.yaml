services:
  - type: web
    name: cctv-report-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CCTV_AUTH_MODE
        value: password
      - key: CCTV_AUTH_SECRET
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: ASSET_STORAGE_DIR
        value: /tmp/cctv-storage
